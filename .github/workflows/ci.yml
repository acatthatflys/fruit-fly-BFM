name: ci

on:
  push:
    branches: [main, "arena/*"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core, stdlib only)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Unit tests (no optional deps)
        run: python -m unittest discover -s tests -v

  test-with-optional-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with data deps for loader regression test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[data]"
      - name: Loader + brain + sim tests
        run: python -m unittest discover -s tests -v

  # Optional torch job — runs only if torch installs; non-blocking for stdlib core
  test-torch-path:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with torch
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[torch,data]"
      - name: Torch LIF smoke test
        run: |
          python - << 'PY'
          import torch
          print("torch", torch.__version__, "cuda", torch.cuda.is_available())
          from flybfm.brain.connectome import synthetic_connectome, flight_subgraph
          from flybfm.brain.lif import LIFNetwork
          conn = flight_subgraph(synthetic_connectome(seed=1))
          net = LIFNetwork(conn, seed=1)
          tnet = net.to_torch(device="cpu")
          # run a few steps, check spikes and rates
          for _ in range(20):
              tnet.clear_inputs()
              for i in range(len(conn)):
                  tnet.set_input(i, 1.0)
              tnet.step()
          print("torch path ok, spikes last step", len(tnet.spikes), "mean rate", tnet.population_rate())
          PY
